{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="center-screen">
  <div class="card-k">
    <div class="stack">
      <div>
        <h1 class="title">로그인</h1>
        <p class="sub">아이디와 비밀번호를 입력하세요.</p>
      </div>
      <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label>아이디</label>
          <input type="text" name="username" value="{{ username or '' }}" required autofocus inputmode="latin">
        </div>
        <div class="field">
          <label>비밀번호</label>
          <input type="password" name="password" required>
        </div>
        <button class="btn-k btn-primary btn-lg">로그인</button>
      </form>
      <div class="muted-link" style="display:flex; justify-content:center; gap:16px; flex-wrap:wrap;">
        <a href="{{ url_for('auth.find_id') }}">아이디 찾기</a>
        <span style="color:var(--line);">|</span>
        <a href="{{ url_for('auth.find_password') }}">비밀번호 찾기</a>
      </div>
      <div class="muted-link">
        <a href="{{ url_for('auth.register') }}">입주민 가입 신청 →</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
