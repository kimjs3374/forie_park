{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
<div class="card-k">
  <div class="stack">
    <div>
      <h1 class="title">비밀번호 변경</h1>
      {% if forced %}
      <p class="sub" style="color:var(--danger); font-weight:700;">
        임시 비밀번호로 로그인했습니다. 계속하려면 <b>새 비밀번호를 설정</b>하세요.
      </p>
      {% else %}
      <p class="sub">새 비밀번호를 입력하세요.</p>
      {% endif %}
    </div>
    <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label>새 비밀번호</label>
        <input type="password" name="new_password" placeholder="8자 이상" required autofocus>
      </div>
      <div class="field">
        <label>새 비밀번호 확인</label>
        <input type="password" name="new_password2" required>
      </div>
      <button class="btn-k btn-primary btn-lg">비밀번호 변경</button>
    </form>
    {% if not forced %}
    <div class="muted-link">
      <a href="{{ url_for('main.index') }}">← 취소</a>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
