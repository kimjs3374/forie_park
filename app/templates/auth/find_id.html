{% extends "base.html" %}
{% block title %}아이디 찾기{% endblock %}
{% block content %}
<div class="card-k">
  <div class="stack">
    <div>
      <h1 class="title">아이디 찾기</h1>
      <p class="sub">가입 시 입력한 <b>동/호/이름/연락처</b>로 아이디를 찾습니다.</p>
    </div>

    {% if found %}
    <div class="flash success" style="margin:0;">
      회원님의 아이디는 다음과 같습니다:
      <div style="margin-top:10px; display:flex; flex-direction:column; gap:8px;">
        {% for u in found %}
        <div style="font-size:1.5rem; font-weight:800; letter-spacing:-.02em;">{{ u }}</div>
        {% endfor %}
      </div>
    </div>
    <a class="btn-k btn-primary btn-lg" href="{{ url_for('auth.login') }}">로그인하러 가기</a>
    {% else %}
    <form method="post" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="row2">
        <div class="field">
          <label>동</label>
          <input type="text" name="dong" value="{{ form.dong or '' }}" placeholder="101" inputmode="numeric" required>
        </div>
        <div class="field">
          <label>호</label>
          <input type="text" name="ho" value="{{ form.ho or '' }}" placeholder="1502" inputmode="numeric" required>
        </div>
      </div>
      <div class="field">
        <label>이름</label>
        <input type="text" name="name" value="{{ form.name or '' }}" required>
      </div>
      <div class="field">
        <label>휴대전화</label>
        <input type="tel" name="phone" value="{{ form.phone or '' }}" placeholder="010-0000-0000" inputmode="numeric" required>
      </div>
      <button class="btn-k btn-primary btn-lg">아이디 찾기</button>
    </form>
    {% endif %}

    <div class="muted-link">
      <a href="{{ url_for('auth.login') }}">← 로그인으로 돌아가기</a>
    </div>
  </div>
</div>
{% endblock %}
