{% extends "base.html" %}
{% block title %}방문차량 등록{% endblock %}
{% block content %}
<style>
  .seg{ display:grid; grid-auto-flow:column; gap:8px; }
  .seg .opt{
    border:2px solid var(--line); background:#f8fafc; border-radius:14px;
    padding:14px 0; text-align:center; font-weight:700; font-size:1.05rem; cursor:pointer;
    color:#334155; transition:.12s; user-select:none;
  }
  .seg .opt.on{
    border-color:var(--primary); background:#eef2ff; color:var(--primary-d);
    box-shadow:0 0 0 4px rgba(79,70,229,.10);
  }
  .datesel{
    width:100%; height:60px; font-size:1.15rem; font-weight:700; color:var(--ink);
    border:2px solid var(--line); border-radius:14px; padding:0 34px 0 14px; background:#f8fafc;
    appearance:none; -webkit-appearance:none; cursor:pointer; outline:none;
    background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='3' stroke-linecap='round'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat; background-position:right 12px center;
  }
  .datesel:focus{ border-color:var(--primary); background-color:#fff; box-shadow:0 0 0 4px rgba(79,70,229,.12); }
  .summary{ background:linear-gradient(135deg,#0d9488,#14b8a6); color:#fff; border-radius:18px; padding:20px; text-align:center; }
  .summary.bad{ background:linear-gradient(135deg,#dc2626,#ef4444); }
  .summary .lab{ font-size:.95rem; opacity:.85; }
  .summary .big{ font-size:1.7rem; font-weight:800; margin-top:4px; letter-spacing:-.02em; }
  .summary .dur{ font-size:.95rem; opacity:.9; margin-top:6px; }
  .modal-back{ position:fixed; inset:0; background:rgba(15,23,42,.6); z-index:100;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .modal-card{ background:#fff; border-radius:20px; padding:28px 24px; max-width:400px; width:100%;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6); }
  .modal-title{ font-size:1.3rem; font-weight:800; color:var(--danger); margin-bottom:12px; }
  .modal-body{ color:var(--ink); font-size:1.05rem; line-height:1.6; margin-bottom:20px; }
</style>

{% if block_msg %}
<div id="blockModal" class="modal-back">
  <div class="modal-card">
    <div class="modal-title">⚠️ 등록 불가</div>
    <div class="modal-body">{{ block_msg }}</div>
    <button class="btn-k btn-primary" onclick="document.getElementById('blockModal').remove()">확인</button>
  </div>
</div>
{% endif %}

<div class="card-k">
  <div class="stack">
    <div>
      <h1 class="title">방문차량 등록</h1>
      <p class="sub">{{ current_user.household_label }} 세대</p>
    </div>

    <form method="post" class="stack" id="visitForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <!-- 차량번호 -->
      <div class="field">
        <label>차량번호</label>
        <input type="text" name="car_number" id="carInput" value="{{ form.car_number or '' }}"
               placeholder="12가3456" maxlength="9" autocomplete="off"
               style="text-align:center; font-size:1.7rem; letter-spacing:.06em;" required autofocus>
        <div id="carHint" style="margin-top:8px; font-size:.9rem; font-weight:600; color:var(--muted); text-align:center;">
          예) 12가3456 · 123가4567 · 서울12가3456
        </div>
      </div>

      <!-- 방문자 연락처 -->
      <div class="field">
        <label>방문자 연락처</label>
        <input type="tel" name="visitor_phone" id="phoneInput" value="{{ form.visitor_phone or '' }}"
               placeholder="010-1234-5678" maxlength="20" autocomplete="off" inputmode="numeric" required
               style="text-align:center; font-size:1.3rem; letter-spacing:.04em;">
      </div>

      <!-- 방문사유 -->
      <div class="field">
        <label>방문사유</label>
        <input type="text" name="visit_reason" id="reasonInput" value="{{ form.visit_reason or '' }}"
               placeholder="예) 가족·지인 방문, 택배, 방문서비스" maxlength="100"
               autocomplete="off" list="reasonList" required style="font-size:1.15rem;">
        <datalist id="reasonList">
          <option value="가족·지인 방문"></option>
          <option value="택배·배송"></option>
          <option value="방문서비스(수리·설치)"></option>
          <option value="학습지·방문교육"></option>
          <option value="업무·미팅"></option>
        </datalist>
      </div>

      <!-- 입차 날짜: 오늘/내일/모레 + 년/월/일 드롭다운 -->
      <div class="field">
        <label>입차 날짜</label>
        <div class="seg" id="inDaySeg" style="margin-bottom:10px;">
          <div class="opt on" data-day="0">오늘</div>
          <div class="opt" data-day="1">내일</div>
          <div class="opt" data-day="2">모레</div>
        </div>
        <div style="display:grid; grid-template-columns:1.3fr 1fr 1fr; gap:8px;">
          <select id="yearSel" class="datesel"></select>
          <select id="monthSel" class="datesel"></select>
          <select id="daySel" class="datesel"></select>
        </div>
      </div>

      <!-- 방문기간 (최대 3일, 하루 종일) -->
      <div class="field">
        <label>방문기간 <span style="color:var(--muted); font-weight:600;">(최대 3일 · 하루 종일 통과)</span></label>
        <div class="seg" id="outDaySeg">
          <div class="opt on" data-plus="0">당일</div>
          <div class="opt" data-plus="1">+1일</div>
          <div class="opt" data-plus="2">+2일</div>
        </div>
      </div>

      <!-- [시간단위 등록 UI — 추후 재사용 위해 주석 보관] -->

      <!-- 요약 -->
      <div class="summary" id="summary">
        <div class="lab" id="sumLab">방문 일정</div>
        <div class="big" id="sumBig">--</div>
        <div class="dur" id="sumDur">--</div>
      </div>

      <input type="hidden" name="entry_time" id="entry_time">
      <input type="hidden" name="exit_time" id="exit_time">

      <button class="btn-k btn-primary btn-lg" id="submitBtn">등록하기</button>
      <a href="{{ url_for('main.index') }}" class="btn-k btn-ghost">취소</a>
    </form>
  </div>
</div>

<script>
(function(){
  const pad=n=>String(n).padStart(2,'0');
  const WD=['일','월','화','수','목','금','토'];
  const DAY=86400000;
  let outPlus=0;
  const yearSel=document.getElementById('yearSel');
  const monthSel=document.getElementById('monthSel');
  const daySel=document.getElementById('daySel');

  function todayMidnight(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
  function fmtNice(d){ return `${pad(d.getMonth()+1)}/${pad(d.getDate())}(${WD[d.getDay()]})`; }
  function fmtLocal(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  function addOpt(sel,val,txt){ const o=document.createElement('option'); o.value=val; o.textContent=txt; sel.appendChild(o); }

  (function initSel(){
    const y=todayMidnight().getFullYear();
    for(let yy=y; yy<=y+1; yy++) addOpt(yearSel,yy,yy+'년');
    for(let mm=1; mm<=12; mm++) addOpt(monthSel,mm,mm+'월');
    setDate(todayMidnight());
  })();

  function rebuildDays(){
    const dim=new Date(+yearSel.value,+monthSel.value,0).getDate();
    const cur=+daySel.value||1;
    daySel.innerHTML='';
    for(let dd=1; dd<=dim; dd++) addOpt(daySel,dd,dd+'일');
    daySel.value=Math.min(cur,dim);
  }
  function setDate(d){ yearSel.value=d.getFullYear(); monthSel.value=d.getMonth()+1; rebuildDays(); daySel.value=d.getDate(); }
  function entryDate(){ const d=new Date(+yearSel.value,+monthSel.value-1,+daySel.value); d.setHours(0,0,0,0); return d; }
  function exitDate(){ const d=new Date(entryDate().getTime()+outPlus*DAY); d.setHours(23,59,0,0); return d; }

  const CAR_RE=/^(?:[가-힣]{2})?\d{2,3}[가-힣]\d{4}$/;
  function carOk(){ return CAR_RE.test((document.getElementById('carInput').value||'').replace(/\s/g,'')); }
  function renderCarHint(){
    const v=(document.getElementById('carInput').value||'').replace(/\s/g,'');
    const hint=document.getElementById('carHint');
    if(!v){ hint.style.color='var(--muted)'; hint.textContent='예) 12가3456 · 123가4567 · 서울12가3456'; }
    else if(carOk()){ hint.style.color='var(--ok)'; hint.textContent='✓ 올바른 차량번호'; }
    else { hint.style.color='var(--danger)'; hint.textContent='형식 확인: 12가3456 / 123가4567 / 서울12가3456'; }
  }
  function syncChips(){
    const diff=Math.round((entryDate()-todayMidnight())/DAY);
    document.querySelectorAll('#inDaySeg .opt').forEach(o=>o.classList.toggle('on',+o.dataset.day===diff));
    document.querySelectorAll('#outDaySeg .opt').forEach(o=>o.classList.toggle('on',+o.dataset.plus===outPlus));
  }
  function render(){
    syncChips();
    const eIn=entryDate(), eOut=exitDate();
    const past=eIn<todayMidnight();
    document.getElementById('entry_time').value=fmtLocal(eIn);
    document.getElementById('exit_time').value=fmtLocal(eOut);
    const sum=document.getElementById('summary');
    if(past){ sum.classList.add('bad');
      document.getElementById('sumLab').textContent='날짜 오류';
      document.getElementById('sumBig').textContent='지난 날짜는 등록할 수 없습니다';
      document.getElementById('sumBig').style.fontSize='1.2rem';
      document.getElementById('sumDur').textContent='입차 날짜를 다시 선택하세요';
    } else { sum.classList.remove('bad');
      document.getElementById('sumLab').textContent='방문 일정';
      document.getElementById('sumBig').textContent=`${fmtNice(eIn)} ~ ${fmtNice(eOut)}`;
      document.getElementById('sumBig').style.fontSize='1.3rem';
      document.getElementById('sumDur').textContent=`입차가능일 ${outPlus+1}일`;
    }
    renderCarHint();
    const reasonOk=(document.getElementById('reasonInput').value||'').trim().length>0;
    const phoneOk=(document.getElementById('phoneInput').value||'').replace(/\D/g,'').length>=9;
    const ok=carOk()&&reasonOk&&phoneOk&&!past;
    const btn=document.getElementById('submitBtn'); btn.disabled=!ok; btn.style.opacity=ok?1:.5;
  }
  document.getElementById('carInput').addEventListener('input',render);
  document.getElementById('reasonInput').addEventListener('input',render);
  document.getElementById('phoneInput').addEventListener('input',render);
  yearSel.addEventListener('change',()=>{ rebuildDays(); render(); });
  monthSel.addEventListener('change',()=>{ rebuildDays(); render(); });
  daySel.addEventListener('change',render);
  document.querySelectorAll('#inDaySeg .opt').forEach(o=>o.addEventListener('click',()=>{
    setDate(new Date(todayMidnight().getTime()+(+o.dataset.day)*DAY)); render();
  }));
  document.querySelectorAll('#outDaySeg .opt').forEach(o=>o.addEventListener('click',()=>{ outPlus=+o.dataset.plus; render(); }));
  render();
})();
</script>
{% endblock %}
