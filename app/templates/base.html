<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>{% block title %}방문차량 등록{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    :root{
      --bg:#0f172a;            /* 딥 네이비 배경 */
      --surface:#ffffff;
      --primary:#4f46e5;       /* 인디고 */
      --primary-d:#4338ca;
      --ink:#0f172a;
      --muted:#64748b;
      --line:#e2e8f0;
      --ok:#16a34a; --warn:#f59e0b; --danger:#dc2626;
      --radius:22px;
    }
    *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    input, select, textarea, button{ font-family:inherit; }
    html,body{ margin:0; height:100%; }
    body{
      font-family:'Pretendard',system-ui,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, var(--bg) 60%);
      min-height:100%;
      -webkit-font-smoothing:antialiased;
    }
    .kiosk{
      max-width:600px; margin:0 auto; min-height:100vh;
      display:flex; flex-direction:column; padding:0 20px 40px;
    }

    /* 상단 바 */
    .topbar{
      display:flex; align-items:center; justify-content:space-between;
      padding:22px 4px; color:#fff;
    }
    .brand{ font-size:1.25rem; font-weight:800; letter-spacing:-.02em; }
    .topbar a{ color:#cbd5e1; text-decoration:none; font-weight:600; font-size:.95rem; }
    .topbar a:hover{ color:#fff; }
    .chip{ background:rgba(255,255,255,.12); padding:8px 14px; border-radius:999px; }

    /* 카드 */
    .card-k{
      background:var(--surface); border-radius:var(--radius);
      box-shadow:0 20px 50px -20px rgba(0,0,0,.5);
      padding:32px 26px;
    }
    .stack{ display:flex; flex-direction:column; gap:18px; }

    h1.title{ font-size:1.7rem; font-weight:800; letter-spacing:-.03em; margin:0; }
    .sub{ color:var(--muted); font-size:1rem; margin:6px 0 0; }

    /* 큰 입력 */
    .field label{ display:block; font-weight:700; margin-bottom:8px; font-size:1rem; }
    .field input{
      width:100%; height:64px; font-size:1.25rem; font-weight:600;
      border:2px solid var(--line); border-radius:16px; padding:0 18px;
      background:#f8fafc; transition:.15s; outline:none;
    }
    .field input:focus{ border-color:var(--primary); background:#fff; box-shadow:0 0 0 4px rgba(79,70,229,.12); }
    .field input::placeholder{ color:#94a3b8; font-weight:500; }
    .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

    /* 큰 버튼 */
    .btn-k{
      display:flex; align-items:center; justify-content:center; gap:10px;
      width:100%; min-height:64px; font-size:1.2rem; font-weight:800;
      border:none; border-radius:18px; cursor:pointer; text-decoration:none;
      transition:.15s; letter-spacing:-.01em;
    }
    .btn-k:active{ transform:scale(.98); }
    .btn-primary{ background:var(--primary); color:#fff; box-shadow:0 12px 24px -10px var(--primary); }
    .btn-primary:active{ background:var(--primary-d); }
    .btn-ghost{ background:#f1f5f9; color:#334155; }
    .btn-danger-o{ background:#fff; color:var(--danger); border:2px solid #fecaca; min-height:48px; font-size:1rem; }
    .btn-lg{ min-height:84px; font-size:1.5rem; }

    /* 배지 */
    .badge-k{ font-size:.85rem; font-weight:700; padding:6px 12px; border-radius:999px; white-space:nowrap; }
    .b-wait{ background:#fef3c7; color:#92400e; }
    .b-ok{ background:#dcfce7; color:#166534; }
    .b-cancel{ background:#f1f5f9; color:#64748b; }

    /* 리스트 항목 */
    .item{
      background:var(--surface); border-radius:18px; padding:20px;
      display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
      box-shadow:0 10px 30px -20px rgba(0,0,0,.4);
    }
    .item .plate{ font-size:1.4rem; font-weight:800; letter-spacing:-.02em; }
    .item .time{ color:var(--muted); font-size:.95rem; margin-top:4px; line-height:1.5; }

    /* 플래시 */
    .flash{ padding:16px 18px; border-radius:14px; font-weight:600; margin-bottom:14px; }
    .flash.success{ background:#dcfce7; color:#166534; }
    .flash.danger{ background:#fee2e2; color:#991b1b; }
    .flash.warning{ background:#fef3c7; color:#92400e; }
    .flash.info{ background:#e0e7ff; color:#3730a3; }

    .center-screen{ flex:1; display:flex; flex-direction:column; justify-content:center; }
    .muted-link{ text-align:center; }
    .muted-link a{ color:var(--primary); font-weight:700; text-decoration:none; }
    .section-title{ color:#fff; font-weight:800; font-size:1.1rem; margin:6px 4px 14px;
                    display:flex; justify-content:space-between; align-items:center; }
    .section-title a{ color:#cbd5e1; font-weight:600; font-size:.9rem; text-decoration:none; }
    .modal-back{ position:fixed; inset:0; background:rgba(15,23,42,.6); z-index:100;
      display:flex; align-items:center; justify-content:center; padding:24px; }
    .modal-card{ background:#fff; border-radius:20px; padding:28px 24px; max-width:420px; width:100%;
      box-shadow:0 30px 60px -20px rgba(0,0,0,.6); max-height:80vh; overflow-y:auto; }
    .modal-title{ font-size:1.3rem; font-weight:800; margin-bottom:12px; }
    .modal-body{ color:var(--ink); font-size:1.05rem; line-height:1.6; margin-bottom:20px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div class="kiosk">
    <div class="topbar">
      <a class="brand" href="{{ url_for('main.index') }}" style="color:#fff; text-decoration:none;">🚗 방문차량 등록</a>
      {% if current_user.is_authenticated %}
      <span>
        {% if current_user.is_admin %}<a class="chip" href="{{ url_for('admin.dashboard') }}">관리</a>{% endif %}
        <a href="{{ url_for('auth.logout') }}">로그아웃</a>
      </span>
      {% endif %}
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
  <script>
  (function(){
    function fmt(iso){ if(!iso) return '-'; var d=new Date(iso);
      return d.toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}); }
    function durText(ms){ if(ms<0) ms=0; var m=Math.floor(ms/60000);
      if(m<60) return m+'분'; return Math.floor(m/60)+'시간 '+(m%60)+'분'; }
    function tick(){
      document.querySelectorAll('[data-inout]').forEach(function(el){
        var inv=el.getAttribute('data-in'), outv=el.getAttribute('data-out');
        var vin=el.querySelector('.v-in'), vout=el.querySelector('.v-out'), vd=el.querySelector('.v-dur'), vs=el.querySelector('.v-sess');
        if(vin) vin.textContent = inv? fmt(inv) : '-';
        if(vout) vout.textContent = outv? fmt(outv) : '-';
        if(vd){
          if(!inv){ vd.textContent='-'; }
          else { var end = outv? new Date(outv) : new Date();
                 vd.textContent = durText(end - new Date(inv)) + (outv? '' : ' (주차중)'); }
        }
        if(vs){
          if(!inv){ vs.textContent=''; }
          else if(outv){ vs.textContent = '('+durText(new Date(outv) - new Date(inv))+')'; }
          else { vs.textContent = '(주차중 '+durText(new Date() - new Date(inv))+')'; }
        }
      });
    }
    tick(); setInterval(tick, 30000);
    // 목록을 나중에 이어 붙이는 화면(무한 스크롤)이 새 카드를 바로 채울 수 있게 열어 둔다.
    window.forieTick = tick;
  })();
  </script>
</body>
</html>
